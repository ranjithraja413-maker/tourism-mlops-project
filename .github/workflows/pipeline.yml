name: Tourism Project Pipeline

on:
  push:
    branches:
      - main            # every push to main runs the full ML pipeline
  workflow_dispatch:    # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write       # needed so the pipeline can commit the trained model back to main

concurrency:
  group: tourism-pipeline
  cancel-in-progress: false

jobs:

  # 1 ─ Validate and register the dataset stored in the repo
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v6
        with:
          name: registered-data
          path: |
            tourism_project/data/tourism.csv
            tourism_project/data/data_registry.json

  # 2 ─ Clean, split and hand the splits to the next job as an artifact
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v6
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # 3 ─ Tune + track with MLflow, then commit the best model to main
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v6
        with:
          name: data-splits
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow.log 2>&1 &   # MLflow UI in the background
          sleep 10   # give the server time to start
      - name: Model Building
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: python tourism_project/model_building/train.py
      - name: Upload MLflow Runs
        uses: actions/upload-artifact@v6
        with:
          name: mlflow-runs
          path: |
            mlruns/
            mlartifacts/
            mlflow.log
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_tourism_model_v1.joblib tourism_project/deployment/model_metrics.json
          git commit -m "Update trained model [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main

  # 4 ─ Smoke-test the Streamlit app against the model that was just committed
  app-smoke-test:
    needs: model-training
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # latest main, which now contains the new model
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/deployment/requirements.txt
      - name: Install App Dependencies
        run: pip install -r tourism_project/deployment/requirements.txt
      - name: Run Streamlit App Test
        run: |
          python - <<'EOF'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("tourism_project/deployment/app.py", default_timeout=60).run()
          assert not at.exception, at.exception
          at.button[0].click().run()
          assert not at.exception, at.exception
          result = (at.success or at.warning)[0].value
          print("App prediction OK ->", result)
          EOF
